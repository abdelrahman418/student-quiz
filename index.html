            <option value="">Select Grade</option>

            <option value="grade5.html">
                Grade 5
            </option>

        </select>

        <button onclick="startQuiz()">
            Start Quiz
        </button>

        <p class="footer">
            Good luck! 🍀
        </p>

    </div>


    <script>

        function startQuiz() {

            let name =
                document.getElementById("studentName").value;

            let age =
                document.getElementById("studentAge").value;

            let grade =
                document.getElementById("studentGrade").value;


            if (name == "" || age == "" || grade == "") {

                alert(
                    "Please enter your name, age and grade."
                );

                return;
            }


            localStorage.setItem(
                "studentName",
                name
            );

            localStorage.setItem(
                "studentAge",
                age
            );


            window.location.href = grade;

        }

    </script>
