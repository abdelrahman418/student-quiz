```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Student Quiz</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #1e3a8a,
                    #2563eb
                );
        }

        .card {
            width: 90%;
            max-width: 450px;

            background: white;

            padding: 45px 35px;

            border-radius: 24px;

            box-shadow:
                0 25px 60px
                rgba(0, 0, 0, 0.25);

            text-align: center;
        }

        .icon {
            width: 80px;
            height: 80px;

            margin: 0 auto 20px;

            border-radius: 20px;

            background: #2563eb;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 40px;
        }

        h1 {
            color: #0f172a;

            font-size: 32px;

            margin-bottom: 10px;
        }

        .subtitle {
            color: #64748b;

            margin-bottom: 35px;

            font-size: 15px;
        }

        label {
            display: block;

            text-align: left;

            font-weight: bold;

            color: #334155;

            margin-bottom: 10px;
        }

        input {
            width: 100%;

            padding: 15px;

            border: 2px solid #e2e8f0;

            border-radius: 12px;

            font-size: 16px;

            outline: none;

            transition: 0.2s;
        }

        input:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, 0.12);
        }

        button {
            width: 100%;

            margin-top: 25px;

            padding: 15px;

            border: none;

            border-radius: 12px;

            background: #2563eb;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        button:hover {
            background: #1d4ed8;

            transform: translateY(-2px);
        }

        .message {
            margin-top: 18px;

            color: #dc2626;

            font-size: 14px;
        }

        .footer {
            margin-top: 30px;

            color: #94a3b8;

            font-size: 13px;
        }

    </style>

</head>


<body>


    <div class="card">


        <div class="icon">
            🎓
        </div>


        <h1>
            Student Quiz
        </h1>


        <p class="subtitle">
            Enter your Student ID to continue
        </p>


        <label for="studentID">
            Student ID
        </label>


        <input
            type="text"
            id="studentID"
            placeholder="Example: ST-0001"
        >


        <button onclick="login()">
            LOGIN →
        </button>


        <p
            class="message"
            id="message">
        </p>


        <p class="footer">
            Online Examination System
        </p>


    </div>


    <script>

        function login() {

            let id =
                document
                .getElementById("studentID")
                .value
                .trim();


            if (id == "") {

                document
                .getElementById("message")
                .innerHTML =
                "Please enter your Student ID.";

                return;
            }


            document
            .getElementById("message")
            .innerHTML =
            "Student ID received.";

        }

    </script>


</body>

</html>
```
