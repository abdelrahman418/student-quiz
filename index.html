<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Quiz</title>
</head>

<body>

    <h1>Student Quiz</h1>

    <p>Please enter your information.</p>

    <label>Your Name:</label>
    <input type="text" id="studentName">

    <br><br>

    <label>Your Age:</label>
    <input type="number" id="studentAge">

    <br><br>

    <label>Select Your Grade:</label>

    <select id="studentGrade">

        <option value="">Select Grade</option>

        <option value="grade5.html">Grade 5</option>

    </select>

    <br><br>

    <button onclick="startQuiz()">Start Quiz</button>

    <script>

        function startQuiz() {

            let name = document.getElementById("studentName").value;
            let age = document.getElementById("studentAge").value;
            let grade = document.getElementById("studentGrade").value;

            if (name == "" || age == "" || grade == "") {

                alert("Please enter your name, age and grade.");

                return;
            }

            localStorage.setItem("studentName", name);
            localStorage.setItem("studentAge", age);

            window.location.href = grade;

        }

    </script>

</body>

</html>
