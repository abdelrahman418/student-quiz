
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Quiz</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #0f172a, #1e3a8a, #2563eb);
        }

        .card {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.25);
            text-align: center;
        }

        .icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            border-radius: 20px;
            background: #2563eb;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
        }

        h1 {
            color: #0f172a;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        label {
            display: block;
            text-align: left;
            font-weight: bold;
            color: #334155;
            margin-bottom: 10px;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .message {
            margin-top: 18px;
            font-size: 14px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .success {
            color: #16a34a;
        }

        .error {
            color: #dc2626;
        }

        .student-info {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #f8fafc;
            border-radius: 15px;
            text-align: left;
        }

        .student-info p {
            margin-bottom: 10px;
            color: #334155;
            overflow-wrap: anywhere;
        }

        .student-info p:last-child {
            margin-bottom: 0;
        }

        .start-button {
            display: none;
        }

        .footer {
            margin-top: 25px;
            color: #94a3b8;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <main class="card">
        <div class="icon">🎓</div>

        <h1>Student Quiz</h1>

        <p class="subtitle">
            Enter your Student ID to continue
        </p>

        <div id="loginBox">
            <label for="studentID">Student ID</label>

            <input
                type="text"
                id="studentID"
                placeholder="Example: ST-0001"
                autocomplete="off"
            >

            <button id="loginButton" type="button" onclick="login()">
                LOGIN →
            </button>
        </div>

        <p id="message" class="message" aria-live="polite"></p>

        <section id="studentInfo" class="student-info">
            <p>
                <strong>Name:</strong>
                <span id="studentName"></span>
            </p>

            <p>
                <strong>Grade:</strong>
                <span id="studentGrade"></span>
            </p>
        </section>

        <button
            id="startButton"
            class="start-button"
            type="button"
            onclick="startQuiz()"
        >
            VIEW AVAILABLE EXAMS →
        </button>

        <p class="footer">Online Examination System</p>
    </main>

    <script>
        const API_URL =
            "https://script.google.com/macros/s/AKfycbyRZJLJ12V-xxJa1mWMQvNLkhi20SNODf_Yu-lxdBiOpiRr4joPqZF-sRHcWnf2ox96fw/exec";

        let currentStudent = null;

        function showMessage(text, type) {
            const message = document.getElementById("message");
            message.textContent = text;
            message.className = "message " + type;
        }

        async function login() {
            const id = document
                .getElementById("studentID")
                .value
                .trim();

            const loginButton = document.getElementById("loginButton");
            const startButton = document.getElementById("startButton");

            if (!id) {
                showMessage("Please enter your Student ID.", "error");
                return;
            }

            loginButton.disabled = true;
            loginButton.textContent = "CHECKING...";
            startButton.style.display = "none";
            document.getElementById("studentInfo").style.display = "none";

            currentStudent = null;
            showMessage("Checking student information...", "");

            try {
                const response = await fetch(
                    API_URL + "?id=" + encodeURIComponent(id)
                );

                if (!response.ok) {
                    throw new Error("Server response: " + response.status);
                }

                const data = await response.json();

                if (!data.success) {
                    showMessage(
                        data.message || "Invalid Student ID. Please try again.",
                        "error"
                    );
                    return;
                }

                if (!data.id || !data.name || !data.grade) {
                    throw new Error("Student information is incomplete.");
                }

                currentStudent = data;

                // حفظ بيانات الطالب بعد نجاح التحقق
                localStorage.setItem("studentID", data.id);
                localStorage.setItem("studentName", data.name);
                localStorage.setItem("studentGrade", data.grade);

                document.getElementById("studentName").textContent = data.name;
                document.getElementById("studentGrade").textContent = data.grade;
                document.getElementById("studentInfo").style.display = "block";

                startButton.style.display = "block";

                showMessage(
                    "Student ID verified successfully!",
                    "success"
                );

            } catch (error) {
                console.error("Login error:", error);

                showMessage(
                    "Connection error. Please check your internet connection and Apps Script deployment.",
                    "error"
                );

            } finally {
                loginButton.disabled = false;
                loginButton.textContent = "LOGIN →";
            }
        }

        function startQuiz() {
            if (!currentStudent) {
                const studentID = localStorage.getItem("studentID");
                const studentName = localStorage.getItem("studentName");
                const studentGrade = localStorage.getItem("studentGrade");

                if (!studentID || !studentName || !studentGrade) {
                    showMessage("Please login first.", "error");
                    return;
                }
            }

            window.location.href = "student-exams.html";
        }

        // السماح بتسجيل الدخول بالضغط على Enter
        document.getElementById("studentID").addEventListener(
            "keydown",
            function(event) {
                if (event.key === "Enter") {
                    login();
                }
            }
        );
    </script>
</body>
</html>
