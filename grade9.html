<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Grade 9 English Exam</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;

    background:
        linear-gradient(
            135deg,
            #0f172a,
            #1e3a8a,
            #2563eb
        );

    padding: 20px;
}

.container {
    width: 100%;
    max-width: 900px;
    margin: auto;
}

/* ================= HEADER ================= */

.header {
    background: white;

    border-radius: 20px;

    padding: 25px;

    margin-bottom: 20px;

    box-shadow:
        0 20px 50px rgba(0,0,0,0.2);
}

.title h1 {
    color: #0f172a;

    margin-bottom: 8px;
}

.title p {
    color: #64748b;
}

.student {
    margin-top: 20px;

    background: #eff6ff;

    padding: 15px;

    border-radius: 12px;

    color: #1e3a8a;
}

.student p {
    margin: 6px 0;
}

.timer {
    margin-top: 20px;

    background: #f1f5f9;

    padding: 12px;

    text-align: center;

    border-radius: 12px;

    font-size: 20px;

    font-weight: bold;
}

.progress-info {
    display: flex;

    justify-content: space-between;

    margin-top: 20px;

    color: #475569;

    font-size: 14px;
}

.progress {
    margin-top: 8px;

    width: 100%;

    height: 10px;

    background: #e2e8f0;

    border-radius: 20px;

    overflow: hidden;
}

.progress-bar {
    height: 100%;

    width: 0%;

    background: #2563eb;

    transition: width 0.3s;
}

/* ================= QUESTION ================= */

.question-card {
    background: white;

    border-radius: 20px;

    padding: 30px;

    box-shadow:
        0 20px 50px rgba(0,0,0,0.2);
}

.instruction {
    display: inline-block;

    background: #eff6ff;

    color: #2563eb;

    padding: 8px 12px;

    border-radius: 10px;

    font-weight: bold;

    margin-bottom: 20px;
}

.question-number {
    color: #2563eb;

    font-weight: bold;

    margin-bottom: 15px;
}

.question {
    font-size: 21px;

    line-height: 1.7;

    color: #0f172a;

    margin-bottom: 20px;
}

label {
    display: block;

    color: #475569;

    font-weight: bold;

    margin-bottom: 10px;
}

textarea {
    width: 100%;

    min-height: 130px;

    padding: 15px;

    border: 2px solid #e2e8f0;

    border-radius: 12px;

    font-size: 17px;

    font-family: Arial;

    resize: vertical;

    outline: none;
}

textarea:focus {
    border-color: #2563eb;
}

/* ================= BUTTONS ================= */

.buttons {
    display: flex;

    gap: 10px;

    margin-top: 20px;
}

button {
    flex: 1;

    padding: 15px;

    border: none;

    border-radius: 12px;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

.previous {
    background: #e2e8f0;

    color: #334155;
}

.next {
    background: #2563eb;

    color: white;
}

.submit {
    background: #16a34a;

    color: white;
}

.result {
    display: none;
