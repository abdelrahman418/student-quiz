
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Available Exams</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #172033;
      background: linear-gradient(135deg, #eef4ff, #f8faff);
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 30px;
    }

    .student-info {
      color: #526079;
      font-size: 16px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .logout {
      background: #e7ebf3;
      color: #253047;
    }

    .exam-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 18px;
    }

    .exam-card {
      padding: 22px;
      border: 1px solid #e0e7f2;
      border-radius: 18px;
      background: white;
      box-shadow: 0 8px 25px rgba(25, 45, 85, 0.07);
    }

    .exam-card h2 {
      margin-top: 0;
      overflow-wrap: anywhere;
    }

    .exam-details {
      color: #65718a;
      margin: 12px 0 20px;
    }

    .start-button {
      width: 100%;
      color: white;
      background: #245be8;
    }

    .start-button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .message {
      padding: 18px;
      margin: 20px 0;
      border-radius: 12px;
      background: white;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .error {
      color: #a32020;
      background: #fff0f0;
      border: 1px solid #ffd0d0;
    }

    .loading {
      color: #455570;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 500px) {
      body {
        padding: 18px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <header class="header">
      <div>
        <h1>🎓 Available Exams</h1>
        <div class="student-info" id="studentInfo">
          Loading student information...
        </div>
      </div>

      <button class="logout" id="logoutButton">
        Log out
      </button>
    </header>

    <div id="message" class="message loading" role="status">
      Loading available exams...
    </div>

    <section id="examList" class="exam-list"></section>
  </main>

  <script>
    const API_URL =
      "https://script.google.com/macros/s/AKfycbyRZJLJ12V-xxJa1mWMQvNLkhi20SNODfY-u-lxdBiOpiRr4joPqZF-sRHcWnf2ox96fw/exec";

    const messageBox = document.getElementById("message");
    const examList = document.getElementById("examList");
    const studentInfo = document.getElementById("studentInfo");

    function showMessage(text, isError = false) {
      messageBox.textContent = text;
      messageBox.className =
        "message" + (isError ? " error" : " loading");
      messageBox.classList.remove("hidden");
    }

    function hideMessage() {
      messageBox.classList.add("hidden");
    }

    function getStudent() {
      const id =
        localStorage.getItem("studentID") ||
        localStorage.getItem("studentId") ||
        localStorage.getItem("student_id");

      const name =
        localStorage.getItem("studentName") || "Student";

      const grade =
        localStorage.getItem("studentGrade") || "";

      return { id, name, grade };
    }

    function logout() {
      localStorage.removeItem("studentID");
      localStorage.removeItem("studentId");
      localStorage.removeItem("student_id");
      localStorage.removeItem("studentName");
      localStorage.removeItem("studentGrade");

      window.location.href = "index.html";
    }

    document.getElementById("logoutButton")
      .addEventListener("click", logout);

    async function loadExams() {
      examList.replaceChildren();

      const student = getStudent();

      if (!student.id) {
        showMessage(
          "Student information is missing. Please log in again.",
          true
        );
        return;
      }

      studentInfo.textContent =
        student.name + (student.grade ? " | " + student.grade : "");

      showMessage("Loading available exams...");

      try {
        const url =
          API_URL +
          "?action=listExams&id=" +
          encodeURIComponent(student.id) +
          "&_=" +
          Date.now();

        const response = await fetch(url, {
          method: "GET",
          redirect: "follow",
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("Server HTTP error: " + response.status);
        }

        const result = await response.json();

        if (!result || result.success !== true) {
          throw new Error(
            result && result.message
              ? result.message
              : "The server could not load the exams."
          );
        }

        if (!Array.isArray(result.exams)) {
          throw new Error(
            "The server response does not contain an exams list. " +
            "Check the Apps Script deployment."
          );
        }

        if (result.exams.length === 0) {
          showMessage(
            "There are no published exams for your grade yet."
          );
          return;
        }

        hideMessage();

        result.exams.forEach(exam => {
          const card = document.createElement("article");
          card.className = "exam-card";

          const title = document.createElement("h2");
          title.textContent = exam.title || "Untitled Exam";

          const details = document.createElement("p");
          details.className = "exam-details";
          details.textContent =
            (exam.grade || student.grade || "") +
            " • " +
            (Number(exam.durationMinutes) || 0) +
            " minutes";

          const button = document.createElement("button");
          button.className = "start-button";
          button.textContent = "Start / Continue Exam";

          button.addEventListener("click", () => {
            startExam(exam, button);
          });

          card.append(title, details, button);
          examList.appendChild(card);
        });

      } catch (error) {
        console.error("Exam loading error:", error);

        showMessage(
          "Error loading exams: " +
          (error.message || String(error)),
          true
        );
      }
    }

    async function startExam(exam, button) {
      const student = getStudent();

      if (!student.id) {
        showMessage("Please log in again.", true);
        return;
      }

      button.disabled = true;
      button.textContent = "Opening exam...";

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            action: "startOrResume",
            studentId: student.id,
            examId: exam.examId
          })
        });

        const result = await response.json();

        if (!result || result.success !== true) {
          throw new Error(
            result && result.message
              ? result.message
              : "Could not start the exam."
          );
        }

        sessionStorage.setItem(
          "currentExam",
          JSON.stringify({
            examId: exam.examId,
            title: exam.title,
            attemptId: result.attemptId,
            deadline: result.deadline,
            answers: result.answers || {}
          })
        );

        window.location.href =
          "exam.html?examId=" +
          encodeURIComponent(exam.examId);

      } catch (error) {
        console.error("Start exam error:", error);

        showMessage(
          "Could not start the exam: " +
          (error.message || String(error)),
          true
        );

        button.disabled = false;
        button.textContent = "Start / Continue Exam";
      }
    }

    loadExams();
  </script>
</body>
</html>
