<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Grade 7 English Exam</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;

    background:
        linear-gradient(135deg, #0f172a, #1e3a8a, #2563eb);

    padding: 25px 15px;
}

.container {
    width: 100%;
    max-width: 900px;
    margin: auto;
}

.header {
    background: white;
    border-radius: 22px;
    padding: 25px;
    margin-bottom: 20px;

    box-shadow:
        0 20px 50px rgba(0,0,0,.20);
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;

    gap: 20px;
    flex-wrap: wrap;
}

.title h1 {
    color: #0f172a;
    font-size: 30px;
    margin-bottom: 8px;
}

.title p {
    color: #64748b;
}

.student {
    background: #eff6ff;

    padding: 15px 20px;

    border-radius: 15px;

    color: #1e3a8a;
}

.student p {
    margin: 5px 0;
}

.timer {
    margin-top: 20px;

    background: #f1f5f9;

    border-radius: 12px;

    padding: 12px;

    text-align: center;

    font-size: 20px;

    font-weight: bold;

    color: #0f172a;
}

.progress-area {
    margin-top: 18px;
}

.progress-info {
    display: flex;
    justify-content: space-between;

    margin-bottom: 8px;

    color: #475569;

    font-size: 14px;
}

.progress {
    width: 100%;
    height: 10px;

    background: #e2e8f0;

    border-radius: 20px;

    overflow: hidden;
}

.progress-bar {
    height: 100%;
    width: 0%;

    background: #2563eb;

    transition: width .3s;
}

.question-card {
    background: white;

    border-radius: 22px;

    padding: 35px;

    box-shadow:
        0 20px 50px rgba(0,0,0,.20);
}

.question-number {
    color: #2563eb;

    font-weight: bold;

    margin-bottom: 15px;
}

.question {
    color: #0f172a;

    font-size: 21px;

    line-height: 1.7;

    margin-bottom: 25px;
}

.instruction {
    display: inline-block;

    background: #eff6ff;

    color: #1d4ed8;

    padding: 8px 12px;

    border-radius: 10px;

    font-size: 14px;

    font-weight: bold;

    margin-bottom: 18px;
}

.answer-label {
    display: block;

    color: #475569;

    font-weight: bold;

    margin-bottom: 10px;
}

textarea {
    width: 100%;

    min-height: 140px;

    resize: vertical;

    border: 2px solid #e2e8f0;

    border-radius: 14px;

    padding: 15px;

    font-family: Arial, sans-serif;

    font-size: 17px;

    outline: none;
}

textarea:focus {
    border-color: #2563eb;
}

.navigation {
    display: flex;

    gap: 12px;

    margin-top: 20px;
}

.nav-button {
    flex: 1;

    padding: 15px;

    border: none;

    border-radius: 12px;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;
}

.previous {
    background: #e2e8f0;

    color: #334155;
}

.next {
    background: #2563eb;

    color: white;
}

.submit {
    background: #16a34a;

    color: white;
}

.result {
    display: none;

    background: white;

    border-radius: 22px;

    padding: 50px 30px;

    text-align: center;

    box-shadow:
        0 20px 50px rgba(0,0,0,.20);
}

.result-icon {
    font-size: 65px;

    margin-bottom: 15px;
}

.result h2 {
    color: #0f172a;

    font-size: 32px;
}

.score {
    color: #2563eb;

    font-size: 48px;

    font-weight: bold;

    margin: 20px 0;
}

.result-message {
    color: #64748b;

    font-size: 18px;
}

@media(max-width:600px) {

    .question-card {
        padding: 25px 20px;
    }

    .question {
        font-size: 18px;
    }

    .navigation {
        flex-direction: column;
    }

}

</style>

</head>


<body>


<div class="container">


    <!-- ==============================
         معلومات الامتحان
         ============================== -->

    <div class="header" id="examHeader">

        <div class="top">

            <div class="title">

                <h1>
                    🎓 Grade 7 English Exam
                </h1>

                <p>
                    Complete the sentence using the word in brackets.
                </p>

            </div>


            <div class="student">

                <p>
                    <strong>Name:</strong>

                    <span id="studentName"></span>
                </p>


                <p>
                    <strong>Grade:</strong>

                    <span id="studentGrade"></span>
                </p>

            </div>

        </div>


        <!-- المؤقت -->

        <div class="timer">

            ⏱️ Time Left:

            <span id="timer">
                30:00
            </span>

        </div>


        <!-- شريط التقدم -->

        <div class="progress-area">

            <div class="progress-info">

                <span id="questionNumber">
                    Question 1
                </span>


                <span id="answeredNumber">
                    Answered: 0
                </span>

            </div>


            <div class="progress">

                <div
                    id="progressBar"
                    class="progress-bar">
                </div>

            </div>

        </div>

    </div>


    <!-- ==============================
         الامتحان
         ============================== -->

    <div id="exam">

        <div class="question-card">


            <div class="instruction">

                Rewrite / Change the form

            </div>


            <div
                id="questionNumberInside"
                class="question-number">
            </div>


            <div
                id="question"
                class="question">
            </div>


            <label class="answer-label">

                Write the complete sentence:

            </label>


            <textarea
                id="answer"
                placeholder="Write the complete sentence here...">
            </textarea>


            <div class="navigation">


                <button
                    id="previousButton"
                    class="nav-button previous"
                    onclick="previousQuestion()">

                    ← Previous

                </button>


                <button
                    id="nextButton"
                    class="nav-button next"
                    onclick="nextQuestion()">

                    Next →

                </button>


                <button
                    id="submitButton"
                    class="nav-button submit"
                    onclick="submitExam()"
                    style="display:none;">

                    Submit Exam ✓

                </button>


            </div>

        </div>

    </div>


    <!-- ==============================
         النتيجة
         ============================== -->

    <div
        id="result"
        class="result">


        <div class="result-icon">
            🎉
        </div>


        <h2>
            Exam Completed!
        </h2>


        <div
            id="score"
            class="score">
        </div>


        <p
            id="resultMessage"
            class="result-message">
        </p>


    </div>

</div>



<script>


/* ==========================================
   Google Apps Script
   ========================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbyRZJLJ12V-xxJa1mWMQvNLkhi20SNODf_Yu-lxdBiOpiRr4joPqZF-sRHcWnf2ox96fw/exec";



/* ==========================================
   بيانات الطالب
   ========================================== */

const studentID =
localStorage.getItem("studentID");

const studentName =
localStorage.getItem("studentName");

const studentGrade =
localStorage.getItem("studentGrade");



/* ==========================================
   التأكد من تسجيل الدخول
   ========================================== */

if (
    !studentID ||
    !studentName ||
    !studentGrade
) {

    alert(
        "Please login first."
    );

    window.location.href =
        "index.html";

}



/* ==========================================
   التأكد أن الطالب Grade 7
   ========================================== */

if (
    String(studentGrade)
    .trim()
    .toLowerCase()
    !==
    "grade 7"
) {

    alert(
        "This exam is only for Grade 7."
    );

    window.location.href =
        "index.html";

}



/* ==========================================
   عرض بيانات الطالب
   ========================================== */

document
.getElementById("studentName")
.textContent =
studentName;


document
.getElementById("studentGrade")
.textContent =
studentGrade;



/* =========================================================
   ⭐⭐⭐⭐⭐ مكان أسئلة Grade 7 ⭐⭐⭐⭐⭐

   هنا تضع الأسئلة.

   الطالب لازم يكتب الجملة كاملة.

   مثال:

   {
       question:
       "Ahmed usually (go) to school by bus.",

       answers: [
           "Ahmed usually goes to school by bus."
       ]
   }

   ========================================================= */


const questions = [

    /*
    =====================================================
    ⭐ السؤال رقم 1
    =====================================================

    {
        question:
        "Ahmed usually (go) to school by bus.",

        answers: [
            "Ahmed usually goes to school by bus."
        ]
    },


    =====================================================
    ⭐ السؤال رقم 2
    =====================================================

    {
        question:
        "They (play) football yesterday.",

        answers: [
            "They played football yesterday."
        ]
    },


    =====================================================
    ⭐ السؤال رقم 3
    =====================================================

    {
        question:
        "She (study) English every day.",

        answers: [
            "She studies English every day."
        ]
    }

    */

];



/* ==========================================
   متغيرات الامتحان
   ========================================== */

let currentQuestion = 0;


let answers =
new Array(questions.length)
.fill("");


let examSubmitted = false;



/* ==========================================
   تنظيف الإجابة
   ========================================== */

function normalizeAnswer(text) {

    return String(text)

        .toLowerCase()

        /*
        إزالة علامات الترقيم
        */

        .replace(
            /[.,!?;:"'“”‘’()]/g,
            ""
        )

        /*
        توحيد المسافات
        */

        .replace(
            /\s+/g,
            " "
        )

        .trim();

}



/* ==========================================
   فحص الإجابة
   ========================================== */

function checkAnswer(
    userAnswer,
    correctAnswers
) {

    const user =
        normalizeAnswer(
            userAnswer
        );


    if (
        user === ""
    ) {

        return false;

    }


    return correctAnswers.some(
        correct => {

            return (
                normalizeAnswer(correct)
                ===
                user
            );

        }
    );

}



/* ==========================================
   حفظ الإجابة
   ========================================== */

function saveCurrentAnswer() {

    const box =
        document.getElementById(
            "answer"
        );


    if (
        questions.length > 0
    ) {

        answers[currentQuestion] =
            box.value;

    }

}



/* ==========================================
   حساب الإجابات
   ========================================== */

function updateAnswered() {

    const count =
        answers.filter(
            answer =>
                answer.trim() !== ""
        ).length;


    document
    .getElementById(
        "answeredNumber"
    )
    .textContent =
        "Answered: " +
        count +
        "/" +
        questions.length;

}



/* ==========================================
   عرض السؤال
   ========================================== */

function displayQuestion() {


    /*
    لو مفيش أسئلة
    */

    if (
        questions.length === 0
    ) {

        document
        .getElementById(
            "questionNumberInside"
        )
        .textContent =
            "No questions yet";


        document
        .getElementById(
            "question"
        )
        .textContent =
            "Grade 7 questions will be added here.";


        document
        .getElementById(
            "answer"
        )
        .disabled =
            true;


        document
        .getElementById(
            "previousButton"
        )
        .style.display =
            "none";


        document
        .getElementById(
            "nextButton"
        )
        .style.display =
            "none";


        document
        .getElementById(
            "submitButton"
        )
        .style.display =
            "none";


        return;

    }


    const item =
        questions[currentQuestion];


    document
    .getElementById(
        "questionNumberInside"
    )
    .textContent =
        "Question " +
        (currentQuestion + 1) +
        " of " +
        questions.length;


    document
    .getElementById(
        "question"
    )
    .textContent =
        item.question;


    document
    .getElementById(
        "answer"
    )
    .value =
        answers[currentQuestion];


    document
    .getElementById(
        "questionNumber"
    )
    .textContent =
        "Question " +
        (currentQuestion + 1) +
        " of " +
        questions.length;


    document
    .getElementById(
        "progressBar"
    )
    .style.width =
        (
            (
                (currentQuestion + 1)
                /
                questions.length
            )
            * 100
        )
        +
        "%";


    updateAnswered();



    /*
    Previous
    */

    if (
        currentQuestion === 0
    ) {

        document
        .getElementById(
            "previousButton"
        )
        .style.display =
            "none";

    }

    else {

        document
        .getElementById(
            "previousButton"
        )
        .style.display =
            "block";

    }



    /*
    Next / Submit
    */

    if (
        currentQuestion ===
        questions.length - 1
    ) {

        document
        .getElementById(
            "nextButton"
        )
        .style.display =
            "none";


        document
        .getElementById(
            "submitButton"
        )
        .style.display =
            "block";

    }

    else {

        document
        .getElementById(
            "nextButton"
        )
        .style.display =
            "block";


        document
        .getElementById(
            "submitButton"
        )
        .style.display =
            "none";

    }

}



/* ==========================================
   Next
   ========================================== */

function nextQuestion() {

    saveCurrentAnswer();


    if (
        currentQuestion <
        questions.length - 1
    ) {

        currentQuestion++;

        displayQuestion();

    }

}



/* ==========================================
   Previous
   ========================================== */

function previousQuestion() {

    saveCurrentAnswer();


    if (
        currentQuestion > 0
    ) {

        currentQuestion--;

        displayQuestion();

    }

}



/* ==========================================
   المؤقت
   ========================================== */

let timeLeft =
30 * 60;


function updateTimer() {

    const minutes =
        Math.floor(
            timeLeft / 60
        );


    const seconds =
        timeLeft % 60;


    document
    .getElementById(
        "timer"
    )
    .textContent =
        String(minutes)
        .padStart(2, "0")
        +
        ":" +
        String(seconds)
        .padStart(2, "0");


    if (
        timeLeft <= 0
    ) {

        clearInterval(timer);


        alert(
            "Time is over. Your exam will be submitted automatically."
        );


        submitExam();

        return;

    }


    timeLeft--;

}


const timer =
setInterval(
    updateTimer,
    1000
);


updateTimer();



/* ==========================================
   Submit
   ========================================== */

async function submitExam() {

    if (
        examSubmitted
    ) {

        return;

    }


    saveCurrentAnswer();


    const unanswered =
        answers.filter(
            answer =>
                answer.trim() === ""
        ).length;


    if (
        unanswered > 0
    ) {

        const confirmSubmit =
            confirm(
                "You have " +
                unanswered +
                " unanswered question(s).\n\n" +
                "Do you want to submit anyway?"
            );


        if (
            !confirmSubmit
        ) {

            return;

        }

    }


    const finalConfirm =
        confirm(
            "Are you sure you want to submit your exam?"
        );


    if (
        !finalConfirm
    ) {

        return;

    }


    examSubmitted = true;


    clearInterval(timer);


    let score = 0;


    for (
        let i = 0;
        i < questions.length;
        i++
    ) {

        if (
            checkAnswer(
                answers[i],
                questions[i].answers
            )
        ) {

            score++;

        }

    }


    await saveResult(
        score
    );


    showResult(
        score
    );

}



/* ==========================================
   حفظ النتيجة في Google Sheets
   ========================================== */

async function saveResult(
    score
) {

    const total =
        questions.length;


    const percentage =
        total > 0

        ?

        Math.round(
            (score / total) * 100
        )

        :

        0;


    try {

        await fetch(
            API_URL,
            {

                method: "POST",

                body:
                    JSON.stringify({

                        studentID:
                            studentID,

                        studentName:
                            studentName,

                        grade:
                            studentGrade,

                        score:
                            score,

                        total:
                            total,

                        percentage:
                            percentage

                    })

            }
        );


        console.log(
            "Result saved successfully."
        );

    }

    catch(error) {

        console.error(
            "Error saving result:",
            error
        );

    }

}



/* ==========================================
   عرض النتيجة
   ========================================== */

function showResult(
    score
) {

    const total =
        questions.length;


    const percentage =
        total > 0

        ?

        Math.round(
            (score / total) * 100
        )

        :

        0;


    document
    .getElementById(
        "examHeader"
    )
    .style.display =
        "none";


    document
    .getElementById(
        "exam"
    )
    .style.display =
        "none";


    document
    .getElementById(
        "result"
    )
    .style.display =
        "block";


    document
    .getElementById(
        "score"
    )
    .textContent =
        score +
        " / " +
        total;


    let message;


    if (
        percentage >= 90
    ) {

        message =
            "Excellent! 🌟";

    }

    else if (
        percentage >= 75
    ) {

        message =
            "Very good! 👏";

    }

    else if (
        percentage >= 50
    ) {

        message =
            "Good effort! 👍";

    }

    else {

        message =
            "Keep practicing! 💪";

    }


    document
    .getElementById(
        "resultMessage"
    )
    .textContent =
        message +
        " Your percentage is " +
        percentage +
        "%.";

}



/* ==========================================
   تشغيل الامتحان
   ========================================== */

displayQuestion();

</script>


</body>

</html>
