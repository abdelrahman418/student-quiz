<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Grade 5 Quiz</title>
</head>

<body>

    <h1>Grade 5 Quiz</h1>

    <p>Answer all questions.</p>


    <!-- Question 1 -->

    <h3>1. What is 5 + 5?</h3>

    <input type="radio" name="q1" value="10"> 10<br>
    <input type="radio" name="q1" value="15"> 15<br>
    <input type="radio" name="q1" value="20"> 20<br>
    <input type="radio" name="q1" value="5"> 5<br>


    <!-- Question 2 -->

    <h3>2. What is the capital of Egypt?</h3>

    <input type="radio" name="q2" value="Cairo"> Cairo<br>
    <input type="radio" name="q2" value="Aswan"> Aswan<br>
    <input type="radio" name="q2" value="Luxor"> Luxor<br>
    <input type="radio" name="q2" value="Giza"> Giza<br>


    <!-- Question 3 -->

    <h3>3. How many days are in a week?</h3>

    <input type="radio" name="q3" value="7"> 7<br>
    <input type="radio" name="q3" value="5"> 5<br>
    <input type="radio" name="q3" value="10"> 10<br>
    <input type="radio" name="q3" value="12"> 12<br>


    <br>

    <button onclick="submitQuiz()">Submit Quiz</button>


    <h2 id="result"></h2>


    <script>

        function submitQuiz() {

            let score = 0;

            if (document.querySelector('input[name="q1"]:checked')?.value == "10") {
                score++;
            }

            if (document.querySelector('input[name="q2"]:checked')?.value == "Cairo") {
                score++;
            }

            if (document.querySelector('input[name="q3"]:checked')?.value == "7") {
                score++;
            }

            document.getElementById("result").innerHTML =
                "Your Score: " + score + " / 3";

        }

    </script>

</body>

</html>
